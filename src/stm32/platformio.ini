[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
debug_tool = stlink
upload_protocol = stlink
debug_load_mode = always
monitor_speed = 921600
lib_extra_dirs = 
    C:/Users/Kermit/Documents/Arduino/libraries
    C:/Program Files (x86)/Arduino/libraries
